name: 功能建议
description: 说明阅读中遇到的困难和你期待的改善
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: "你正在做什么，现有操作哪里不顺手？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期待的改进
      description: "描述希望发生的行为，可补充参考示意或替代方案。"
    validations:
      required: true
